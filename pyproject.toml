[project]
name = "omubot-new"
version = "0.1.0"
description = "A small, policy-controlled Omubot rewrite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pillow>=12,<13",
    "pydantic>=2.9,<3",
    "wsproto>=1.2,<2",
    "portalocker>=4.3,<5",
    "tzdata>=2025.2",
    "cryptography>=45,<51",
    "lunar-python==1.4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
omubot-new = "omubot_new.bootstrap:main"
omubot-memory-cleaner = "omubot_new.spool_cleaner_cli:main"
omubot-qq-test-runner = "omubot_new.qq_test_runner:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pyright>=1.1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.sdist]
include = ["/src/omubot_new", "/pyproject.toml", "/uv.lock", "/hatch_build.py", "/scripts/dev/export-web-contracts.py", "/scripts/dev/check-web-state.mjs", "/config.example.toml", "/web/src", "/web/index.html", "/web/package.json", "/web/package-lock.json", "/web/tsconfig.json", "/web/vite.config.ts"]

[tool.hatch.build]
artifacts = ["src/omubot_new/web_static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
