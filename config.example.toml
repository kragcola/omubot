# Restart to apply. Offline never calls the configured model or OneBot endpoint.
# For parallel development/installed bots, prefer --init-instance and --instance.
instance_id = "standalone"
instance_name = "default"
listen_port = 18081
onebot_token_env = "OMUBOT_ONEBOT_TOKEN"
reply_segment_chars = 1000
max_reply_segments = 5
bot_id = "10001"
db_path = "storage/d2.sqlite3"
mode = "offline"
active_model = "claude"
task_models = { reply = "claude" }
timezone = "Asia/Shanghai"
queue_capacity = 16
total_timeout = 105.0
# Fixed reply preparation / first-dispatch admission / whole delivery limits.
# Existing saved limits remain unchanged; these are fresh-install defaults.
reply_generation_timeout = 30.0
reply_admission_timeout = 30.0
reply_delivery_timeout = 45.0
model_timeout = 20.0
send_timeout = 5.0
history_ttl = 900.0
max_sessions = 128
tool_capabilities = ["clock.read"]
model_concurrency = 4
thinker_reserve = 1
max_active_sessions = 8
thinker_enabled = true
max_interruptions = 3

# Use the complete request URL: no automatic /v1 or method-path guessing.
# Model IDs below are placeholders; use any tool-capable model your endpoint supports.
# Keys belong in environment variables, never in this file.
[models.claude]
api_format = "anthropic"
endpoint = "https://api.anthropic.com/v1/messages"
model = "your-claude-model-id"
api_key_env = "OMUBOT_CLAUDE_KEY"
max_output_tokens = 1024

[models.openai]
api_format = "openai_chat"
endpoint = "https://api.openai.com/v1/chat/completions"
model = "your-openai-model-id"
api_key_env = "OMUBOT_OPENAI_KEY"
max_output_tokens = 1024
# For compatible APIs that require the older token field, change to "max_tokens".
token_parameter = "max_completion_tokens"

[models.responses]
api_format = "openai_responses"
endpoint = "https://api.openai.com/v1/responses"
model = "your-responses-model-id"
api_key_env = "OMUBOT_OPENAI_KEY"
max_output_tokens = 1024

[models.deepseek]
api_format = "deepseek"
endpoint = "https://api.deepseek.com/chat/completions"
model = "your-deepseek-model-id"
api_key_env = "OMUBOT_DEEPSEEK_KEY"
max_output_tokens = 1024
thinking = false
# If enabling thinking, also set send_history = false (current-turn reasoning only).
# Optional knobs are sent only if configured and must be supported by the selected model.
# temperature = 0.7
# reasoning_effort = "high"  # DeepSeek: requires thinking = true.
